[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testforge"
version = "0.4.0"
description = "Intelligent distributed test automation & GPU validation framework"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TestForge Project"}]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "PyYAML>=6.0",
    "psutil>=5.9",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dashboard = ["fastapi>=0.100", "uvicorn>=0.23"]
assistant = ["httpx>=0.24"]

[project.scripts]
testforge = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["testforge*", "cli*"]
